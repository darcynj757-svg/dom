<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Страница не найдена — Кедр Томск</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #121310;
        color: #f4f2eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 0%, rgba(217, 167, 58, 0.16), transparent 42%),
          #121310;
      }
      main {
        width: min(100% - 32px, 640px);
        padding: 48px 24px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #f4f2eb;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(244, 242, 235, 0.6);
        border-radius: 10px;
        color: #e6b843;
        font-size: 18px;
      }
      .code {
        margin: 44px 0 4px;
        color: #e6b843;
        font-size: clamp(72px, 18vw, 132px);
        line-height: 0.9;
        font-weight: 800;
        letter-spacing: -0.08em;
      }
      h1 {
        margin: 28px 0 12px;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1.1;
      }
      p {
        max-width: 480px;
        margin: 0 auto 32px;
        color: #b8b7ad;
        font-size: 17px;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }
      .button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        padding: 0 22px;
        border-radius: 999px;
        background: #e6b843;
        color: #171710;
        font-weight: 700;
        text-decoration: none;
      }
      .button.secondary {
        border: 1px solid rgba(244, 242, 235, 0.24);
        background: transparent;
        color: #f4f2eb;
      }
      .button:focus-visible, .brand:focus-visible {
        outline: 3px solid #f4f2eb;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Кедр Томск — на главную">
        <span class="brand-mark" aria-hidden="true">⌂</span>
        <span>Кедр Томск</span>
      </a>
      <div class="code" aria-hidden="true">404</div>
      <h1>Страница не найдена</h1>
      <p>Похоже, такой страницы не существует или она была перемещена. Вернитесь на главную или посмотрите наши проекты.</p>
      <div class="actions">
        <a class="button" href="/">На главную</a>
        <a class="button secondary" href="/projects">Смотреть проекты</a>
      </div>
    </main>
  </body>
</html>
